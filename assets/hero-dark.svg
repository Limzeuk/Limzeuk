<style><![CDATA[
 .orbitA { transform-origin:940px 219px; animation: orbitA 22s linear infinite; }
 .orbitB { transform-origin:940px 219px; animation: orbitB 28s linear infinite; }
 .wave { stroke-dasharray:520 35; animation: moveWave 7s linear infinite; }
 .spark { animation: sparkle 3.8s ease-in-out infinite; }
 .spark2 { animation: sparkle 3.8s ease-in-out -1.6s infinite; }
 @keyframes orbitA { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
 @keyframes orbitB { from{transform:rotate(360deg)}to{transform:rotate(0deg)} }
 @keyframes moveWave { to{stroke-dashoffset:-555} }
 @keyframes sparkle { 0%,100%{opacity:.35}50%{opacity:1} }
 @media (prefers-reduced-motion:reduce){.orbitA,.orbitB,.wave,.spark,.spark2{animation:none}}
]]></style>
