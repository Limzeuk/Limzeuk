name: Sync Latest Articles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: limgeek-readme-rss-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out README repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch RSS and update only the latest writings block
        run: python3 scripts/sync_latest_posts.py
      - name: Commit changes only when the README differs
        run: |
          if git diff --quiet -- README.md; then
            echo 'No changes to README.md; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: sync latest writings from RSS'
          git push origin 'HEAD:main'
